name: Read-only PHP2Shell audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/php2shell-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up SSH without revealing credentials
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!variable}" ]]; then echo "Required deployment secret is missing" >&2; exit 1; fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed \
            '/^----- BEGIN DEPLOY_SSH_KEY -----$/d; /^----- END DEPLOY_SSH_KEY -----$/d' \
            > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Audit PHP versions on the deployed host (read only)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE_AUDIT'
          set -uo pipefail
          echo "=== PHP2Shell: READ-ONLY HOST AUDIT ==="
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
          if [[ -f /etc/os-release ]]; then
            . /etc/os-release
            printf 'OS=%s %s\n' "${ID:-unknown}" "${VERSION_ID:-unknown}"
          fi
          # CLI PHP might differ from PHP actually serving website requests.
          declare -A seen=()
          for candidate in php php-fpm php-cgi /usr/bin/php /usr/local/bin/php \
            /opt/alt/php*/usr/bin/php /opt/plesk/php/*/bin/php \
            /opt/remi/php*/root/usr/bin/php /opt/php*/bin/php; do
            [[ -x "$candidate" ]] || command -v "$candidate" >/dev/null 2>&1 || continue
            binary="$(command -v "$candidate" 2>/dev/null || printf '%s' "$candidate")"
            [[ -x "$binary" ]] || continue
            actual="$(readlink -f "$binary" 2>/dev/null || printf '%s' "$binary")"
            [[ -n "${seen[$actual]:-}" ]] && continue
            seen[$actual]=1
            first_line="$("$binary" -v 2>/dev/null | head -n 1 || true)"
            [[ -n "$first_line" ]] && printf 'BINARY_VERSION=%s\n' "$first_line"
          done
          echo "PROCESS_PHP_VERSIONS_BEGIN"
          processes=0
          while read -r pid name; do
            case "$name" in
              php-fpm*|php-cgi*|lsphp*)
                processes=$((processes + 1))
                [[ "$processes" -gt 8 ]] && break
                running_bin="$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
                if [[ -n "$running_bin" && -x "$running_bin" ]]; then
                  running_version="$("$running_bin" -v 2>/dev/null | head -n 1 || true)"
                  printf 'RUNNING_PHP_PROCESS=%s; %s\n' "$name" "${running_version:-version-unavailable}"
                else
                  printf 'RUNNING_PHP_PROCESS=%s; version-inaccessible\n' "$name"
                fi
                ;;
            esac
          done < <(ps -eo pid=,comm= 2>/dev/null || true)
          printf 'PHP_PROCESS_MATCHES_SAMPLED=%s\n' "$processes"
          echo "PROCESS_PHP_VERSIONS_END"
          if command -v rpm >/dev/null 2>&1; then
            rpm -qa --qf 'PACKAGE=%{NAME} %{VERSION}-%{RELEASE}\n' 2>/dev/null \
              | grep -E '^PACKAGE=(php|ea-php|alt-php|plesk-php)' | head -n 30 || true
          elif command -v dpkg-query >/dev/null 2>&1; then
            dpkg-query -W -f='PACKAGE=${binary:Package} ${Version}\n' 'php*' 2>/dev/null | head -n 30 || true
          fi
          echo "=== AUDIT_DONE (NO SERVER CHANGES) ==="
          REMOTE_AUDIT

      - name: Inspect PHP selection hints for this website (read only)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          printf -v safe_path '%q' "$DEPLOY_PATH"
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- $safe_path" <<'REMOTE_HINTS'
          set -uo pipefail
          root="$1"
          echo "=== WEBSITE PHP CONFIG HINTS (READ ONLY) ==="
          if [[ -d "$root/public_html" && -f "$root/public_html/index.php" ]]; then
            echo "PROJECT_DOCUMENT_ROOT=present"
          else
            echo "PROJECT_DOCUMENT_ROOT=not-found-at-expected-path"
          fi
          for location in "$root" "$root/public_html"; do
            if [[ -f "$location/.htaccess" ]]; then
              hints="$(grep -Eio '(php[0-9]{2}|php[0-9]\\.[0-9]|AddHandler|SetHandler)' "$location/.htaccess" 2>/dev/null | sort -u | tr '\n' ' ' || true)"
              printf 'HTACCESS_PHP_HINTS=%s\n' "${hints:-none}"
            else
              echo "HTACCESS_PHP_HINTS=not-present"
            fi
          done
          for folder in "$root" "$(dirname "$root")"; do
            base="$(basename "$folder")"
            if [[ "$base" =~ ^[a-zA-Z0-9.-]+\\.[a-zA-Z]{2,}$ ]]; then
              printf 'DOMAIN_CANDIDATE=%s\n' "$base"
            fi
          done
          echo "=== END WEBSITE PHP CONFIG HINTS ==="
          REMOTE_HINTS

      - name: Verify real HTTP PHP runtime with temporary token-protected probe
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          printf -v safe_path '%q' "$DEPLOY_PATH"
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- $safe_path" <<'REMOTE_WEB_PROBE'
          set -euo pipefail
          docroot="$1/public_html"
          if [[ ! -f "$docroot/index.php" || ! -w "$docroot" ]]; then
            echo "WEB_PHP_PROBE=skipped-no-writable-document-root"
            exit 0
          fi
          token="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          probe="$(mktemp "$docroot/.php-cve-audit-XXXXXXXX.php")"
          trap 'rm -f -- "$probe"' EXIT
          cat > "$probe" <<'PHP'
          <?php
          if (($_GET['token'] ?? '') !== '__AUDIT_TOKEN__') {
              http_response_code(404);
              exit;
          }
          header('Content-Type: text/plain; charset=utf-8');
          echo 'PHP_WEB_VERSION=', PHP_VERSION, "\n", 'PHP_WEB_SAPI=', PHP_SAPI, "\n";
          PHP
          sed -i "s/__AUDIT_TOKEN__/$token/" "$probe"
          chmod 0644 "$probe"
          for host in dark-style.ru dark-style.orgbox.net; do
            if result="$(curl -fsSL --max-time 20 --connect-timeout 8 \
                 "https://$host/$(basename "$probe")?token=$token" 2>/dev/null)"; then
              if [[ "$result" == PHP_WEB_VERSION=* ]]; then
                echo "SITE=$host"
                printf '%s\n' "$result"
                echo "WEB_PHP_PROBE=confirmed"
              else
                echo "WEB_PHP_PROBE=unexpected-response"
              fi
            else
              echo "WEB_PHP_PROBE=unreachable-or-wrong-document-root"
            fi
          done
          echo "WEB_PHP_PROBE=temporary-file-auto-removed"
          REMOTE_WEB_PROBE
