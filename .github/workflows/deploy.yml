name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing GitHub Secret: ${variable}" >&2
              exit 1
            fi
          done
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"

          key_value="${DEPLOY_SSH_KEY//$'\r'/}"
          if [[ "$key_value" != *$'\n'* && "$key_value" == *'\n'* ]]; then
            key_value="${key_value//\\n/$'\n'}"
          fi

          key_value="$(printf '%s\n' "$key_value" | sed \
            '/^----- BEGIN DEPLOY_SSH_KEY -----$/d; /^----- END DEPLOY_SSH_KEY -----$/d')"

          if [[ "$key_value" == *"PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$key_value" > "$HOME/.ssh/deploy_key"
          elif ! printf '%s' "$key_value" | base64 --decode > "$HOME/.ssh/deploy_key"; then
            echo "DEPLOY_SSH_KEY must contain an OpenSSH/PEM private key or its Base64 representation" >&2
            exit 1
          fi

          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

          known_hosts_value="${DEPLOY_KNOWN_HOSTS//$'\r'/}"
          if [[ "$known_hosts_value" != *$'\n'* && "$known_hosts_value" == *'\n'* ]]; then
            known_hosts_value="${known_hosts_value//\\n/$'\n'}"
          fi
          printf '%s\n' "$known_hosts_value" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy project
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash .deploy/sync_repo_from_git.sh --auto"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
